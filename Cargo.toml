[package]
name = "shapr"
version = "0.1.0"
edition = "2024"
# tree-sitter 0.27 needs 1.90; std File::lock needs 1.89.
rust-version = "1.90"
description = "Classify the shape of a code change: format, comment, rename, move, extract, or logic."
license = "MIT"
repository = "https://github.com/dpep/shapr"
keywords = ["diff", "refactoring", "code-review", "ruby", "ast"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ruby-prism = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

# Discipline the code already keeps, held by the gate.
[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
# An arithmetic overflow panics (exit 2) instead of wrapping into a wrong report.
overflow-checks = true
