name: Shape

# shapr labels its own changes: advisory, never a gate on the verdict.
on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  push:
    branches: [ main ]

permissions:
  contents: read

# A newer push supersedes a run still going.
concurrency:
  group: shape-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Judge a pull request with its base's build, so a change that breaks
  # shapr can't grade itself; a push to main with its own.
  BUILD_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  shape:
    name: shapr
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # shapr needs the base commit, not a shallow clone
          # The PR's own head, not GitHub's merge commit, whose message would
          # read as a claim.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: cached build
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bin/shapr
          key: shapr-${{ runner.os }}-${{ env.BUILD_SHA }}

      - name: check out the build to run
        if: steps.cache.outputs.cache-hit != 'true'
        run: git worktree add --detach "$RUNNER_TEMP/build" "$BUILD_SHA"

      - name: setup Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: cache cargo
        if: steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.temp }}/build

      - name: build shapr
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/build/Cargo.toml"
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/build/target/release/shapr" "$RUNNER_TEMP/bin/shapr"

      - name: shape of the change
        env:
          # Read through env, never interpolated into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          shapr="$RUNNER_TEMP/bin/shapr"
          # A pull request's description is read for claims, like its commits.
          message=()
          if [ -n "$BASE_SHA" ]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.md"
            message=(--message "$RUNNER_TEMP/pr.md")
          fi
          # A pushed merge commit is refused against both parents: take the first.
          if [ -n "$BASE_SHA" ]; then
            RANGE="$BASE_SHA...HEAD"
          elif [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            RANGE="HEAD^1..HEAD"
          else
            RANGE="HEAD^!"
          fi
          "$shapr" -J "${message[@]}" "$RANGE" > shape.ndjson
          text=$("$shapr" "${message[@]}" "$RANGE" | head -n 200)
          verdict=$(tail -n1 shape.ndjson | jq -r .verdict)
          echo "$text"
          {
            echo "### shapr: $verdict"
            echo
            echo '```'
            echo "$text"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=shapr::$verdict ($RANGE)"

      - name: keep the JSON
        uses: actions/upload-artifact@v7
        with:
          name: shape
          path: shape.ndjson
